name: Security Scan

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "12.4.1"
  FLUTTER_VERSION: "3.32.2"

jobs:
  # ---------- Secret scanning ----------
  gitleaks:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------- Dependency audit ----------
  npm-audit:
    name: pnpm Audit
    runs-on: ubuntu-latest

    outputs:
      has-findings: ${{ steps.audit.outputs.has_findings }}
      report: ${{ steps.audit.outputs.report }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run audit
        id: audit
        run: |
          set +e
          REPORT=$(pnpm audit --audit-level=high 2>&1)
          EXIT_CODE=$?
          set -e

          echo "report<<AUDIT_EOF" >> "$GITHUB_OUTPUT"
          echo "$REPORT" >> "$GITHUB_OUTPUT"
          echo "AUDIT_EOF" >> "$GITHUB_OUTPUT"

          if [[ $EXIT_CODE -ne 0 ]]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

  # ---------- Flutter dependency check ----------
  flutter-audit:
    name: Flutter Dependency Check
    runs-on: ubuntu-latest

    outputs:
      has-findings: ${{ steps.outdated.outputs.has_findings }}
      report: ${{ steps.outdated.outputs.report }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Check outdated packages
        id: outdated
        working-directory: apps/mobile
        run: |
          set +e
          REPORT=$(flutter pub outdated 2>&1)
          set -e

          echo "report<<FLUTTER_EOF" >> "$GITHUB_OUTPUT"
          echo "$REPORT" >> "$GITHUB_OUTPUT"
          echo "FLUTTER_EOF" >> "$GITHUB_OUTPUT"

          if echo "$REPORT" | grep -q "dependencies are constrained to versions that are newer"; then
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          fi

  # ---------- Container image scan ----------
  trivy:
    name: Container Image Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    outputs:
      has-findings: ${{ steps.scan.outputs.has_findings }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan API image
        id: scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/lexdata-api:staging
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          output: trivy-report.txt
        continue-on-error: true

      - name: Check scan result
        run: |
          if [[ "${{ steps.scan.outcome }}" == "failure" ]]; then
            echo "has_findings=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_findings=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.txt
          retention-days: 30

  # ---------- Report findings as issue ----------
  report:
    name: Report Findings
    runs-on: ubuntu-latest
    needs: [gitleaks, npm-audit, flutter-audit, trivy]
    if: always()
    permissions:
      issues: write

    steps:
      - name: Create issue if findings exist
        if: >-
          needs.gitleaks.result == 'failure' ||
          needs.npm-audit.outputs.has-findings == 'true' ||
          needs.flutter-audit.outputs.has-findings == 'true' ||
          needs.trivy.outputs.has-findings == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const findings = [];

            if ('${{ needs.gitleaks.result }}' === 'failure') {
              findings.push('### Gitleaks\nSecrets detected in repository. Check the Gitleaks job for details.');
            }

            if ('${{ needs.npm-audit.outputs.has-findings }}' === 'true') {
              findings.push('### pnpm Audit\n```\n${{ needs.npm-audit.outputs.report }}\n```');
            }

            if ('${{ needs.flutter-audit.outputs.has-findings }}' === 'true') {
              findings.push('### Flutter Outdated Packages\n```\n${{ needs.flutter-audit.outputs.report }}\n```');
            }

            if ('${{ needs.trivy.outputs.has-findings }}' === 'true') {
              findings.push('### Trivy Container Scan\nHIGH or CRITICAL vulnerabilities found in container images. Check the Trivy job artifacts for details.');
            }

            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Security] Weekly scan findings — ${date}`,
              body: `## Weekly Security Scan Report\n\n${findings.join('\n\n---\n\n')}\n\n---\n*Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}*`,
              labels: ['security', 'automated']
            });

      - name: All clear
        if: >-
          needs.gitleaks.result == 'success' &&
          needs.npm-audit.outputs.has-findings != 'true' &&
          needs.flutter-audit.outputs.has-findings != 'true' &&
          needs.trivy.outputs.has-findings != 'true'
        run: echo "::notice::Weekly security scan passed with no findings."
