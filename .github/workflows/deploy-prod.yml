name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      version-bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      skip-smoke:
        description: "Skip smoke tests (emergency deploy)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/lexdata
  NODE_VERSION: "20"
  PNPM_VERSION: "12.4.1"

jobs:
  # ---------- Version and changelog ----------
  version:
    name: Create Version Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      new-version: ${{ steps.version.outputs.new_version }}
      changelog: ${{ steps.changelog.outputs.changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Calculate next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT=${LATEST_TAG#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ inputs.version-bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Version: v${LATEST_TAG#v} -> v${NEW_VERSION}"

      - name: Generate changelog
        id: changelog
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -z "$LATEST_TAG" ]]; then
            RANGE="HEAD"
          else
            RANGE="${LATEST_TAG}..HEAD"
          fi

          CHANGELOG=$(git log "$RANGE" --pretty=format:"- %s (%h)" --no-merges 2>/dev/null || echo "- Initial release")
          echo "changelog<<CHANGELOG_EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG_EOF" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag -a "v${{ steps.version.outputs.new_version }}" \
            -m "Release v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

  # ---------- Build Docker images ----------
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: version
    permissions:
      contents: read
      packages: write

    outputs:
      api-image: ${{ steps.meta-api.outputs.tags }}
      worker-image: ${{ steps.meta-worker.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.new-version }}
            type=raw,value=production

      - name: Docker meta (Worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.version.outputs.new-version }}
            type=raw,value=production

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Database migration ----------
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: build-images
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Verify schema drift
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel ./apps/api/prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

      - name: Apply migrations
        run: pnpm db:apply
        env:
          DATABASE_URL: ${{ secrets.PROD_DIRECT_URL }}

  # ---------- Deploy ----------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [version, build-images, migrate]
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy API
        run: |
          echo "::notice::Deploying API v${{ needs.version.outputs.new-version }}"
          echo "TODO: Replace with actual production deployment command"
          # Example: railway up --service api --environment production
          # Example: fly deploy --image $API_IMAGE --app lexdata-api-prod
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}

      - name: Deploy Worker
        run: |
          echo "::notice::Deploying Worker v${{ needs.version.outputs.new-version }}"
          echo "TODO: Replace with actual production deployment command"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PROD }}

  # ---------- Smoke tests ----------
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ !inputs.skip-smoke }}
    environment: production

    steps:
      - name: Wait for deployment readiness
        run: |
          echo "Waiting for production API to become ready..."
          for i in $(seq 1 30); do
            if curl -sf "${{ vars.PROD_API_URL }}/health" > /dev/null 2>&1; then
              echo "API is ready."
              exit 0
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "::error::Production API did not become ready in time."
          exit 1

      - name: Run smoke tests
        run: |
          set -euo pipefail
          API="${{ vars.PROD_API_URL }}"

          echo "--- Health check ---"
          curl -sf "$API/health" | jq .

          echo "--- Auth endpoint reachable ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API/api/v1/auth/login")
          if [[ "$STATUS" == "401" || "$STATUS" == "400" ]]; then
            echo "Auth endpoint responds: $STATUS (expected)"
          else
            echo "::error::Unexpected status from auth: $STATUS"
            exit 1
          fi

          echo "Production smoke tests passed."

  # ---------- Rollback on failure ----------
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: smoke
    if: failure()

    steps:
      - name: Rollback to previous production image
        run: |
          echo "::error::Production smoke tests failed — initiating rollback."
          echo "TODO: Replace with actual rollback command"
          # Example: fly deploy --image <previous-image> --app lexdata-api-prod

  # ---------- Create GitHub Release ----------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [version, smoke]
    if: success() || inputs.skip-smoke
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.new-version }}
          name: v${{ needs.version.outputs.new-version }}
          body: |
            ## LEXDATA IA v${{ needs.version.outputs.new-version }}

            ### Changes
            ${{ needs.version.outputs.changelog }}

            ---
            Deployed to production by @${{ github.actor }}
          draft: false
          prerelease: false

  # ---------- Notifications ----------
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [version, smoke, rollback, release]
    if: always()

    steps:
      - name: Notify success
        if: needs.smoke.result == 'success' || inputs.skip-smoke
        run: |
          echo "::notice::Production deployment v${{ needs.version.outputs.new-version }} succeeded."
          # TODO: Slack/email notification
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"text": "🚀 LEXDATA IA v'"${{ needs.version.outputs.new-version }}"' deployed to production"}'

      - name: Notify failure
        if: needs.smoke.result == 'failure'
        run: |
          echo "::error::Production deployment v${{ needs.version.outputs.new-version }} FAILED."
          # TODO: Slack/email notification (urgent)
