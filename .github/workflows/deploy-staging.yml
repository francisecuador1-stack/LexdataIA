name: Deploy Staging

on:
  workflow_dispatch:  # Manual trigger only until Dockerfile and infra are ready
  # push:
  #   branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/lexdata
  NODE_VERSION: "20"
  PNPM_VERSION: "12.4.1"

jobs:
  # ---------- Build and push Docker images ----------
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      api-image: ${{ steps.meta-api.outputs.tags }}
      worker-image: ${{ steps.meta-worker.outputs.tags }}
      sha-short: ${{ steps.sha.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,prefix=
            type=raw,value=staging

      - name: Docker meta (Worker)
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-worker
          tags: |
            type=sha,prefix=
            type=raw,value=staging

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- Database migration ----------
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: build-images
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Verify schema drift (diff check)
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel ./apps/api/prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      - name: Apply migrations
        run: pnpm db:apply
        env:
          DATABASE_URL: ${{ secrets.STAGING_DIRECT_URL }}

  # ---------- Deploy ----------
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-images, migrate]
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -- Railway deployment placeholder --
      # Replace with your actual deployment commands.
      # Examples for Railway:
      #   railway up --service api --image $API_IMAGE
      # Examples for Fly.io:
      #   fly deploy --image $API_IMAGE --app lexdata-api-staging
      - name: Deploy API
        run: |
          echo "::notice::Deploy API image: ${{ needs.build-images.outputs.api-image }}"
          echo "TODO: Replace with actual deployment command (Railway/Fly/VPS)"
          # Example: railway up --service api
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Worker
        run: |
          echo "::notice::Deploy Worker image: ${{ needs.build-images.outputs.worker-image }}"
          echo "TODO: Replace with actual deployment command (Railway/Fly/VPS)"
          # Example: railway up --service worker
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ---------- Smoke tests ----------
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for deployment readiness
        run: |
          echo "Waiting for staging API to become ready..."
          for i in $(seq 1 30); do
            if curl -sf "${{ vars.STAGING_API_URL }}/health" > /dev/null 2>&1; then
              echo "API is ready."
              exit 0
            fi
            echo "Attempt $i/30 — waiting 10s..."
            sleep 10
          done
          echo "::error::Staging API did not become ready in time."
          exit 1

      - name: Run smoke tests
        run: |
          set -euo pipefail

          API="${{ vars.STAGING_API_URL }}"

          echo "--- Health check ---"
          curl -sf "$API/health" | jq .

          echo "--- Auth endpoint reachable ---"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API/api/v1/auth/login")
          if [[ "$STATUS" == "401" || "$STATUS" == "400" ]]; then
            echo "Auth endpoint responds: $STATUS (expected)"
          else
            echo "::error::Unexpected status from auth: $STATUS"
            exit 1
          fi

          echo "Smoke tests passed."

  # ---------- Rollback on failure ----------
  rollback:
    name: Rollback
    runs-on: ubuntu-latest
    needs: smoke
    if: failure()

    steps:
      - name: Rollback to previous image
        run: |
          echo "::warning::Smoke tests failed — rolling back staging deployment."
          echo "TODO: Replace with actual rollback command"
          # Example: railway up --service api --image <previous-image>
          # Example: fly deploy --image <previous-image> --app lexdata-api-staging

  # ---------- Notifications ----------
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [smoke, rollback]
    if: always()

    steps:
      - name: Notify success
        if: needs.smoke.result == 'success'
        run: |
          echo "::notice::Staging deployment succeeded."
          # TODO: Uncomment and configure Slack webhook
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"text": "✅ LEXDATA IA staging deployed successfully ('"${{ github.sha }}"')"}'

      - name: Notify failure
        if: needs.smoke.result == 'failure' || needs.rollback.result != 'skipped'
        run: |
          echo "::error::Staging deployment failed or was rolled back."
          # TODO: Uncomment and configure Slack webhook
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"text": "❌ LEXDATA IA staging deployment FAILED — rollback triggered ('"${{ github.sha }}"')"}'
