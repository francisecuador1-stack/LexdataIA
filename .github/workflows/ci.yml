name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "12.4.1"
  FLUTTER_VERSION: "3.44.6"

jobs:
  # ---------- Node.js checks (typecheck, lint, unit tests, build) ----------
  check:
    name: Typecheck + Lint + Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lexdata_ci
          POSTGRES_PASSWORD: lexdata_ci
          POSTGRES_DB: lexdata_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lexdata_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # lexdata_ci is superuser — used only for migrations and seeding
      SYSTEM_DB_URL: postgresql://lexdata_ci:lexdata_ci@localhost:5432/lexdata_ci
      # lexdata_app is NOBYPASSRLS — used by the API and integration tests
      DATABASE_URL: postgresql://lexdata_app:lexdata_app@localhost:5432/lexdata_ci
      DIRECT_URL: postgresql://lexdata_app:lexdata_app@localhost:5432/lexdata_ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-do-not-use-in-prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Create lexdata_app role and apply migrations
        run: |
          # Create the application role (NOBYPASSRLS) using the superuser
          psql "$SYSTEM_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'lexdata_app') THEN
                CREATE ROLE lexdata_app LOGIN PASSWORD 'lexdata_app' NOBYPASSRLS;
              END IF;
            END
            $$;
            -- Grant schema usage so lexdata_app can see tables
            GRANT USAGE ON SCHEMA public TO lexdata_app;
          SQL

          # Apply migrations as superuser (creates tables, RLS policies, FORCE RLS)
          DATABASE_URL="$SYSTEM_DB_URL" pnpm db:apply

          # Grant table privileges to lexdata_app (after tables exist)
          psql "$SYSTEM_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO lexdata_app;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO lexdata_app;
          SQL

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm turbo run test:integration --filter=@lexdata/api
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          SYSTEM_DB_URL: ${{ env.SYSTEM_DB_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}

  # ---------- Build verification ----------
  build:
    name: Build (web + api)
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build all packages
        run: pnpm build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # ---------- Flutter checks ----------
  flutter:
    name: Flutter Analyze + Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test
