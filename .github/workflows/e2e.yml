name: E2E Tests

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "12.4.1"

jobs:
  e2e:
    name: Playwright E2E
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.52.0-noble
      options: --user 1001

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lexdata_e2e
          POSTGRES_PASSWORD: lexdata_e2e
          POSTGRES_DB: lexdata_e2e
        options: >-
          --health-cmd="pg_isready -U lexdata_e2e"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://lexdata_e2e:lexdata_e2e@postgres:5432/lexdata_e2e
      DIRECT_URL: postgresql://lexdata_e2e:lexdata_e2e@postgres:5432/lexdata_e2e
      REDIS_URL: redis://redis:6379
      API_URL: http://localhost:3000
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run database migrations
        run: pnpm --filter @lexdata/api prisma migrate deploy

      - name: Seed database
        run: pnpm --filter @lexdata/api prisma db seed

      - name: Build API
        run: pnpm turbo run build --filter=@lexdata/api

      - name: Build Web
        run: pnpm turbo run build --filter=@lexdata/web

      - name: Start API server
        run: |
          cd apps/api
          node dist/main.js &
          sleep 5

      - name: Start Web preview server
        run: |
          cd apps/web
          npx serve dist -l 5173 &
          sleep 3

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Upload failure videos
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-videos
          path: e2e/test-results/**/*.webm
          retention-days: 14

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: e2e/test-results/**/*.png
          retention-days: 14
