name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "Build flavor"
        required: true
        type: choice
        options:
          - staging
          - prod
      platform:
        description: "Target platform"
        required: true
        type: choice
        options:
          - both
          - android
          - ios

env:
  FLUTTER_VERSION: "3.32.2"
  JAVA_VERSION: "17"
  RUBY_VERSION: "3.2"

jobs:
  # ---------- Android build ----------
  android:
    name: Build Android
    if: inputs.platform == 'both' || inputs.platform == 'android'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run code generation
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Decode Android keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/mobile/android/app/keystore.jks
        if: inputs.flavor == 'prod'

      - name: Build APK
        working-directory: apps/mobile
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=FLAVOR=${{ inputs.flavor }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ inputs.flavor }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-info-${{ inputs.flavor }}
          path: apps/mobile/build/debug-info/
          retention-days: 90

      - name: Setup Ruby (for fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: apps/mobile/android

      - name: Deploy to Google Play (internal track)
        if: inputs.flavor == 'prod'
        working-directory: apps/mobile/android
        run: |
          echo "TODO: Configure fastlane Appfile and Fastfile"
          # bundle exec fastlane internal
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Upload debug symbols to Sentry
        if: inputs.flavor == 'prod'
        run: |
          echo "TODO: Configure Sentry CLI"
          # npx @sentry/cli upload-dif apps/mobile/build/debug-info/ \
          #   --org lexdata \
          #   --project lexdata-mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  # ---------- iOS build ----------
  ios:
    name: Build iOS
    if: inputs.platform == 'both' || inputs.platform == 'ios'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Run code generation
        working-directory: apps/mobile
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install

      - name: Import Apple certificates
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | \
            base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Build IPA
        working-directory: apps/mobile
        run: |
          flutter build ipa \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info \
            --dart-define=FLAVOR=${{ inputs.flavor }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ inputs.flavor }}
          path: apps/mobile/build/ios/ipa/*.ipa
          retention-days: 30

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug-info-${{ inputs.flavor }}
          path: apps/mobile/build/debug-info/
          retention-days: 90

      - name: Setup Ruby (for fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
          working-directory: apps/mobile/ios

      - name: Upload to TestFlight
        if: inputs.flavor == 'prod'
        working-directory: apps/mobile/ios
        run: |
          echo "TODO: Configure fastlane Appfile and Fastfile"
          # bundle exec fastlane beta
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

      - name: Upload debug symbols to Sentry
        if: inputs.flavor == 'prod'
        run: |
          echo "TODO: Configure Sentry CLI"
          # npx @sentry/cli upload-dif apps/mobile/build/debug-info/ \
          #   --org lexdata \
          #   --project lexdata-mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
